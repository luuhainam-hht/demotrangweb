<text x="310" y="1080" font-size="12" fill="#4A3B08">Ba tiến trình nền không do người dùng kích hoạt: UC-50 chạy theo Call Timeout (mặc định 45 giây),</text>
<text x="310" y="1096" font-size="12" fill="#4A3B08">UC-51 chạy đúng giờ EOD_PURGE_HOUR theo GIỜ VIỆT NAM, UC-52 quét mỗi phút.</text>
<text x="310" y="1112" font-size="12" fill="#4A3B08">UC-47 bắt buộc grounding từ CSDL để Trợ lý AI không tự bịa thủ tục.</text>
<rect x="1120" y="1060" width="700" height="110" fill="#FFFDF2" stroke="#B9A24A" stroke-width="1.2" rx="3"/>
<text x="1130" y="1080" font-size="12" fill="#4A3B08">CHÚ GIẢI KÝ HIỆU</text>
<text x="1130" y="1096" font-size="12" fill="#4A3B08">Đường liền nét, không mũi tên  →  Association (tác nhân dùng chức năng)</text>
<text x="1130" y="1112" font-size="12" fill="#4A3B08">Nét đứt, mũi tên hở, nhãn «include»  →  chức năng bắt buộc được gọi lại</text>
<text x="1130" y="1128" font-size="12" fill="#4A3B08">Nét đứt, mũi tên hở, nhãn «extend»  →  chức năng mở rộng, có điều kiện</text>
<text x="1130" y="1144" font-size="12" fill="#4A3B08">Nét liền, mũi tên tam giác rỗng  →  Generalization (kế thừa vai trò)</text>

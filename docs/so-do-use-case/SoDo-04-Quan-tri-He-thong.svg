<rect x="320" y="1160" width="820" height="110" fill="#FFFDF2" stroke="#B9A24A" stroke-width="1.2" rx="3"/>
<text x="330" y="1180" font-size="12" fill="#4A3B08">UC-37 là Dynamic Policy Engine: đổi tham số nghiệp vụ (Call Timeout, Max Retry, giờ mở cửa...)</text>
<text x="330" y="1196" font-size="12" fill="#4A3B08">ngay trên giao diện, có hiệu lực tức thì, không cần sửa mã nguồn hay triển khai lại.</text>
<text x="330" y="1212" font-size="12" fill="#4A3B08">UC-45 và UC-46 thu hồi phiên ngay lập tức — khóa tài khoản có hiệu lực tức thì.</text>
<rect x="1160" y="1160" width="700" height="110" fill="#FFFDF2" stroke="#B9A24A" stroke-width="1.2" rx="3"/>
<text x="1170" y="1180" font-size="12" fill="#4A3B08">CHÚ GIẢI KÝ HIỆU</text>
<text x="1170" y="1196" font-size="12" fill="#4A3B08">Đường liền nét, không mũi tên  →  Association (tác nhân dùng chức năng)</text>
<text x="1170" y="1212" font-size="12" fill="#4A3B08">Nét đứt, mũi tên hở, nhãn «include»  →  chức năng bắt buộc được gọi lại</text>
<text x="1170" y="1228" font-size="12" fill="#4A3B08">Nét đứt, mũi tên hở, nhãn «extend»  →  chức năng mở rộng, có điều kiện</text>
<text x="1170" y="1244" font-size="12" fill="#4A3B08">Nét liền, mũi tên tam giác rỗng  →  Generalization (kế thừa vai trò)</text>

<rect x="300" y="1240" width="700" height="110" fill="#FFFDF2" stroke="#B9A24A" stroke-width="1.2" rx="3"/>
<text x="310" y="1260" font-size="12" fill="#4A3B08">Luồng chính: Trang chủ → tìm thủ tục (UC-03) → đối chiếu checklist (UC-04)</text>
<text x="310" y="1276" font-size="12" fill="#4A3B08">→ lấy số (UC-05) → quét QR theo dõi trên điện thoại (UC-11).</text>
<text x="310" y="1292" font-size="12" fill="#4A3B08">UC-12 chạy ngay đầu UC-05: ngoài giờ thì trả về CLOSED, không cấp số.</text>
<rect x="1130" y="1240" width="700" height="110" fill="#FFFDF2" stroke="#B9A24A" stroke-width="1.2" rx="3"/>
<text x="1140" y="1260" font-size="12" fill="#4A3B08">CHÚ GIẢI KÝ HIỆU</text>
<text x="1140" y="1276" font-size="12" fill="#4A3B08">Đường liền nét, không mũi tên  →  Association (tác nhân dùng chức năng)</text>
<text x="1140" y="1292" font-size="12" fill="#4A3B08">Nét đứt, mũi tên hở, nhãn «include»  →  chức năng bắt buộc được gọi lại</text>
<text x="1140" y="1308" font-size="12" fill="#4A3B08">Nét đứt, mũi tên hở, nhãn «extend»  →  chức năng mở rộng, có điều kiện</text>
<text x="1140" y="1324" font-size="12" fill="#4A3B08">Nét liền, mũi tên tam giác rỗng  →  Generalization (kế thừa vai trò)</text>

name: CI

# Chay tu dong tren may chu GitHub moi lan push/tao Pull Request vao nhanh main - khong lien
# quan/khong anh huong gi den viec Render deploy (Render chi doc code + render.yaml, khong
# biet gi ve workflow nay). Muc dich: bat loi som (VD sua code lam hong 1 nghiep vu quan
# trong) truoc khi no len duoc production, thay vi phai cho nguoi dung phat hien.
#
# Nang cap 10/2026:
#   - Chay them kiem thu TICH HOP voi PostgreSQL 17 that (test/integration.db.test.js).
#   - Kiem tra file docker-compose.yml hop le va build duoc Docker image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcc_test
      KIOSK_HOURS_ENFORCED: 'false'
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t hcc-mot-cua:ci .

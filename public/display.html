<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bảng gọi số - Cẩm nang số hỗ trợ Thông tin Hành chính công</title>
<link rel="stylesheet" href="css/common.css?v=16" />
<link rel="icon" href="assets/quoc-huy.png" type="image/png" />
<style>
  /* BANG LED treo tuong: nguoi dan dung/ngoi cach man hinh 3-8 met, trong do co nguoi cao tuoi
     mat kem. Moi co chu deu tinh theo be ngang man hinh (vw) de cung 1 file chay dung tren ca
     man hinh 32 inch lan TV 65 inch, thay vi co chu px co dinh nhu ban cu (3.2rem, doc rat kho
     tu xa tren man hinh lon). clamp() giu can duoi cho man hinh nho va can tren cho man hinh
     cuc lon. Nen dam + chu trang: tuong phan cao nhat, chong loa sang den tran. */
  body, body.theme-gov { background: #140A09; color: #fff; }
  .led-wrap { padding: 2vw 2.5vw; }
  .led-header { text-align: center; margin-bottom: 2vw; }
  .led-header h1 { font-size: clamp(1.6rem, 2.6vw, 3.4rem); margin: 0 0 6px; letter-spacing: 0.06em; color: #F7D774; }
  .led-clock { font-size: clamp(1.1rem, 1.6vw, 2.2rem); color: #E8D9D6; font-weight: 600; }
  .led-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 1.6vw; }
  .led-card {
    background: #22110F; border-radius: 12px; padding: 2vw 1.6vw; text-align: center;
    border: 3px solid #5A2A27;
  }
  /* ===== 4 MAU TRANG THAI (11/2026) - xem src/services/boardState.js =====
     DO = dang thuc hien tai quay | XANH LA = dang trong | VANG = can bo di vang | XANH DUONG = gio nghi.
     Mau nam o VIEN DAY + NEN NHAT + DAI TIEU DE de nguoi mat kem / nhin xa van phan biet duoc,
     khong chi dua vao mau (dai tieu de con ghi chu trang thai). */
  .led-card { --st: #6B5A57; --st-bg: #22110F; --st-ink: #fff; position: relative; overflow: hidden;
    border-color: var(--st); background: var(--st-bg); border-width: 4px; padding-top: 0; }
  .led-card.st-BUSY  { --st: #E53935; --st-bg: #3A0F0E; --st-ink: #fff; }
  .led-card.st-IDLE  { --st: #2EAD4B; --st-bg: #0E2A16; --st-ink: #fff; }
  .led-card.st-AWAY  { --st: #F2C230; --st-bg: #352A08; --st-ink: #1B1500; }
  .led-card.st-BREAK { --st: #2F7BEF; --st-bg: #0D1D3A; --st-ink: #fff; }
  .led-card .state-band {
    margin: 0 -1.6vw 1.2vw; padding: 0.55vw 1vw; background: var(--st); color: var(--st-ink);
    font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
    font-size: clamp(0.95rem, 1.2vw, 1.7rem);
  }
  /* Quay dang GOI so: nhap nhay vien do de nhin luot qua la thay. */
  .led-card.calling { animation: ledPulse 1.6s infinite; }
  @keyframes ledPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(229,57,53,0.35); }
    50% { box-shadow: 0 0 56px rgba(229,57,53,0.8); }
  }
  .led-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8vw 2vw; margin: 0 0 1.6vw; }
  .led-legend span { display: inline-flex; align-items: center; gap: 0.6em; font-weight: 700;
    font-size: clamp(0.9rem, 1.15vw, 1.6rem); color: #F3E7E4; }
  .led-legend i { width: 1.4em; height: 1.4em; border-radius: 4px; display: inline-block; }
  .led-card .counter-name { color: #F3E7E4; font-size: clamp(1.1rem, 1.5vw, 2rem); font-weight: 700; margin-bottom: 8px; }
  .led-card .ticket-num {
    /* nowrap: "A-105" bi ngat dong ngay sau dau gach ngang thanh 2 hang, nhin tu xa rat de doc
       nham thanh 2 so khac nhau. Co chu lay theo be ngang man hinh nhung co tran de 5 ky tu
       luon nam gon 1 hang trong the. */
    font-size: clamp(2.8rem, 5.5vw, 6.5rem); font-weight: 800; letter-spacing: 3px; line-height: 1.1;
    color: #ffffff; white-space: nowrap;
  }
  /* Trang thai bang chu (ĐÓNG QUẦY / TẠM DỪNG / — sẵn sàng —) dai hon so thu tu nhieu lan */
  .led-card .ticket-num-text {
    font-size: clamp(1.5rem, 2.6vw, 3.2rem); letter-spacing: 1px; color: #B9A6A2;
  }
  .led-card.st-AWAY .ticket-num-text { color: #F7D774; }
  .led-card .status-line { margin-top: 10px; font-size: clamp(0.95rem, 1.25vw, 1.7rem); color: #E8D9D6; font-weight: 600; }
  .btn-enable-audio { position: fixed; bottom: 24px; left: 24px; z-index: 50; }

  /* Man hinh LED khong co nguoi bam: an nut Tro ly AI va ca menu dieu huong - khong ai bam duoc
     vao man hinh treo tuong, de lai chi ton cho va lam mat khong gian hien so. */
  .hcc-chat-widget, #chatbot-widget { display: none; }
  /* Dau trang chinh quyen (header.js): bo dong mo ta, chu to hon de doc tu xa */
  .site-nav, .site-nav-toggle { display: none !important; }
  .gov-wrap { max-width: none; padding: 0 2.5vw; }
  .gov-tag { display: none; }
  .gov-emblem { height: clamp(64px, 5vw, 110px); }
  .gov-unit { font-size: clamp(0.9rem, 1.1vw, 1.5rem); }
  .gov-name { font-size: clamp(1.4rem, 2.2vw, 3rem); }
  .gov-national { font-size: clamp(0.8rem, 0.9vw, 1.2rem); }

  /* Man hinh doc (portrait) hay dung cho bang LED dat o hanh lang hep */
  @media (orientation: portrait) {
    .led-grid { grid-template-columns: 1fr; }
    .led-card .ticket-num { font-size: clamp(3.5rem, 13vw, 9rem); }
    /* Trang thai bang chu (ĐÓNG QUẦY...) dai gap nhieu lan so thu tu: khong dung co chu cua so,
       cho phep xuong dong - truoc day tran ra ngoai man hinh doc hep. */
    .led-card .ticket-num-text { font-size: clamp(1.4rem, 6vw, 3rem); white-space: normal; }
  }
</style>
</head>
<body>
<div class="led-wrap">
  <div class="led-header">
    <h1>BẢNG GỌI SỐ</h1>
    <div id="ledClock" class="led-clock"></div>
  </div>
  <div class="led-legend" aria-label="Chú giải màu">
    <span><i style="background:#2EAD4B"></i>Đang trống</span>
    <span><i style="background:#E53935"></i>Đang thực hiện tại quầy</span>
    <span><i style="background:#F2C230"></i>Người ở quầy đi vắng</span>
    <span><i style="background:#2F7BEF"></i>Giờ nghỉ</span>
  </div>
  <div id="ledGrid" class="led-grid"></div>
</div>
<button class="btn btn-primary btn-enable-audio" id="enableAudioBtn" data-action="enableAudio">🔈 Bật âm thanh Loa PA</button>

<script src="js/apiClient.js"></script>
<script src="js/wsClient.js"></script>
<script src="js/actionDelegate.js"></script>
<script src="js/deviceHeartbeat.js?v=1"></script>
<script src="js/display.js?v=6"></script>
<script src="js/header.js?v=6"></script>
</body>
</html>
